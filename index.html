        // --- IndexedDB 4ÏX¨ ---
        let db;
        function initDB() {
            const request = indexedDB.open("HeartbeatStoreDB", 1);
            
            request.onupgradeneeded = function(event) {
              db = event.target.result;
              if (!db.objectStoreNames.contains("avatars")) {
              db.createObjectStore("avatars", { keyPath: "id" });
              }
            };
            
            request.onsuccess = function(event) {
              db = event.target.result;
              loadAvatars();
            };
        }
        
        function saveAvatarToDB(id, dataUrl) {
            if (!db) return;
            const transaction = db.transaction(["avatars"], "readwrite");
            const store = transaction.objectStore("avatars");
            store.put({ id: id, dataUrl: dataUrl });
        }
        
        function loadAvatars() {
            if (!db) return;
            const transaction = db.transaction(["avatars"], "readonly");
            const store = transaction.objectStore("avatars");
            
            const reqUser = store.get('user');
            reqUser.onsuccess = function() {
              if (reqUser.result) {
              document.getElementById('avatar-user').style.backgroundImage = `url(${reqUser.result.dataUrl})`;
              document.getElementById('avatar-user').innerText = '';
              }
            };
            
            const reqChar = store.get('char');
            reqChar.onsuccess = function() {
              if (reqChar.result) {
              document.getElementById('avatar-char').style.backgroundImage = `url(${reqChar.result.dataUrl})`;
              document.getElementById('avatar-char').innerText = '';
              }
            };
        }

            if (pageId === 'checkout-page') renderCheckout();

        function triggerAvatarUpload(role) {
            document.getElementById(`upload-${role}`).click();

        function handleAvatarUpload(event, role) {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
              const dataUrl = e.target.result;
              const avatarEl = document.getElementById(`avatar-${role}`);
              
              // €U„¨;Hœ
              avatarEl.style.opacity = '0';
              setTimeout(() => {
              avatarEl.style.backgroundImage = `url(${dataUrl})`;
              avatarEl.innerText = '';
              avatarEl.style.opacity = '1';
              }, 200);
              
              saveAvatarToDB(role, dataUrl);
              };
              reader.readAsDataURL(file);
            }
        }
        
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            products.forEach(p => {
              const card = document.createElement('div');
              card.className = 'product-card';
              card.innerHTML = `
              <i class="ri-add-line" style="position: absolute; right: 12px; top: 12px; color: var(--border-color);"></i>
              <div class="product-icon"><i class="${p.icon}"></i></div>
              <div class="product-name">${p.name}</div>
              <div class="product-price">${p.price}</div>
              `;
              
              // ¹ûå æÅ
              card.onclick = (e) => {
              if(!isDragging) openModal(p);
              };
              
              // û Öý/  (æx‹ö)
              let startY = 0;
              let currentY = 0;
              let timer = null;
              
              card.addEventListener('touchstart', (e) => {
              startY = e.touches[0].clientY;
              timer = setTimeout(() => {
              isDragging = true;
              card.classList.add('dragging');
              document.getElementById('drop-zone').classList.add('visible');
              }, 300); //  	300msæÑÖý
              }, { passive: true });
              
              card.addEventListener('touchmove', (e) => {
              if(!isDragging) {
              clearTimeout(timer);
              return;
              }
              e.preventDefault(); // ;bÚ¨
              currentY = e.touches[0].clientY;
              
              // €U„ÆÉÍˆ
              const dropZone = document.getElementById('drop-zone');
              const dropZoneRect = dropZone.getBoundingClientRect();
              
              if(currentY > dropZoneRect.top) {
              dropZone.classList.add('active');
              } else {
              dropZone.classList.remove('active');
              }
              }, { passive: false });
              
              card.addEventListener('touchend', (e) => {
              clearTimeout(timer);
              if(isDragging) {
              isDragging = false;
              card.classList.remove('dragging');
              
              const dropZone = document.getElementById('drop-zone');
              dropZone.classList.remove('visible');
              
              if(dropZone.classList.contains('active')) {
              dropZone.classList.remove('active');
              addToCart(p);
              }
              }
              });
              
              grid.appendChild(card);
            });

        function updateDate() {
            const now = new Date();

        function renderCheckout() {
            const list = document.getElementById('receipt-list');
            list.innerHTML = '';
            
            let total = 0;
            
            cart.forEach(item => {
              const numPrice = parseFloat(item.price.replace('¥ ', ''));
              total += numPrice;

            document.getElementById('checkout-action').style.display = 'none';

            const hiddenArea = document.getElementById('hidden-bill-area');

              }, delay);

            // >:Ó>í
            setTimeout(() => {
              document.getElementById('checkout-ending').classList.add('show');

              scrollContent.scrollTop = scrollContent.scrollHeight;
              
              //  z-if

              saveCart();
              updateCartBadge();

        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
